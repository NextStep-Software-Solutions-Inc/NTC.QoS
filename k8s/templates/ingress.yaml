apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($host = '{{ .Values.ntc_qos_fe_domain }}') {
        return 301 https://www.{{ .Values.ntc_qos_fe_domain }}$request_uri;
      }
    
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.ntc_domain }}
        - {{ .Values.ntc_qos_fe_domain }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ntc_domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: 80
    - host: {{ .Values.ntc_qos_fe_domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: 80