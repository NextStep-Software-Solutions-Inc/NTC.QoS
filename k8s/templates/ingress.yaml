apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.nextstep_domain }}
        - {{ .Values.ntc_domain }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.nextstep_domain }}
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: 80
    - host: {{ .Values.ntc_domain }}
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: 80