name: Deploy to DigitalOcean Kubernetes with Helm

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  RELEASE_NAME: ntc-qos-api
  DOCKER_IMAGE: wacanam20/ntc-qos-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest -f ./NTC.QoS.API/Dockerfile .
          docker push ${{ env.DOCKER_IMAGE }}:latest

  validate-deploy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Helm dry-run (validate deployment)
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./k8s \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=latest \
            --dry-run

      - name: Comment deployment status and URL
        uses: actions/github-script@v7
        with:
          script: |
            const status = '✅ Deployment to DigitalOcean Kubernetes can be performed!';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: status
            });

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./k8s \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=latest \
            --set env.ASPNETCORE_ENVIRONMENT=Production

      - name: Check deployment rollout status
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}

      - name: Get Ingress Host
        id: get_url
        run: |
          URL=$(kubectl get ingress ${{ env.RELEASE_NAME }}-ingress -o jsonpath='{.spec.rules[0].host}')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment deployment status and URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const url = '${{ steps.get_url.outputs.url }}';
            const status = '✅ Deployment to DigitalOcean Kubernetes succeeded!';
            const message = `${status}\n\n🔗 [View your app](${url})`;
            console.log(message);