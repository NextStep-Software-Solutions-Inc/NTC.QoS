name: Deploy to DigitalOcean Kubernetes with Helm

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-deploy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Helm dry-run (validate deployment)
        run: |
          helm upgrade --install ntc-qos-api ./k8s \
            --set image.repository=wacanam20/ntc-qos-api \
            --set image.tag=latest \
            --dry-run

      - name: Comment deployment status and URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const url = '${{ steps.get_url.outputs.url }}';
            const status = '✅ Deployment to DigitalOcean Kubernetes succeeded!';
            const message = `${status}\n\n🔗 [View your app](${url})`;
            if (context.issue && context.issue.number) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ntc-qos-api ./k8s \
            --set image.repository=wacanam20/ntc-qos-api \
            --set image.tag=latest

      - name: Get Ingress Host
        id: get_url
        run: |
          URL=$(kubectl get ingress ntc-qos-api-ingress -o jsonpath='{.spec.rules[0].host}')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment deployment status and URL
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "✅ Deployment to DigitalOcean Kubernetes succeeded!\n\n🔗 [View your app](api.qos.nextstep-software.com)"
            });