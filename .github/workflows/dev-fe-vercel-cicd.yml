name: Development Vercel CI/CD (Frontend Web)

on:
  push:
    branches: ["development"]
    paths:
      - "NTC.QoS.Web/**"
      - ".github/workflows/dev-fe-vercel-cicd.yml"
  pull_request:
    branches: ["development"]
    paths:
      - "NTC.QoS.Web/**"
      - ".github/workflows/dev-fe-vercel-cicd.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-development:
    name: 🚀 Deploy Frontend to Vercel (Development)
    runs-on: ubuntu-latest
    environment: Development
    defaults:
      run:
        working-directory: ./NTC.QoS.Web

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('NTC.QoS.Web/bun.lock', 'NTC.QoS.Web/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Install Vercel CLI
        run: bun install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
