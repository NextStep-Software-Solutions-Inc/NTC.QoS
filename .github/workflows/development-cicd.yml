name: Development VPS CI/CD (Backend API)

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

env:
  CONTAINER_NAME: qos-api-dev
  IMAGE_NAME: qos-api:dev
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: "Release"
  ASPNETCORE_ENVIRONMENT: "Development"

jobs:
  build-and-test:
    name: 🧪 Build & Test (.NET 8)
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

  build-and-package:
    name: 🛠️ Build & Package Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }} \
            --build-arg ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }} \
            -t ${{ env.IMAGE_NAME }} \
            -f ./NTC.QoS.API/Dockerfile .
          docker save ${{ env.IMAGE_NAME }} -o qos-api-dev.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qos-api-dev-image
          path: qos-api-dev.tar
          retention-days: 1

  deploy-vps:
    name: 🚀 Deploy to Development VPS
    needs: build-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qos-api-dev-image

      - name: Copy Docker Image to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOST || secrets.HOST }}
          username: ${{ vars.USERNAME || secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "qos-api-dev.tar"
          target: "/tmp/"

      - name: Execute Remote Development Deployment via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.HOST || secrets.HOST }}
          username: ${{ vars.USERNAME || secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Create development directory if not exists
            mkdir -p /opt/docker/qos-api-dev
            
            # Load new image
            docker load -i /tmp/qos-api-dev.tar
            
            # Clean up temporary tar file immediately
            rm -f /tmp/qos-api-dev.tar

            # Stop and remove existing container if running
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # Ensure networks exist
            docker network create npm_proxy_net 2>/dev/null || true
            docker network create ntcqos_db_net 2>/dev/null || true

            # Run container attached to database network
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network ntcqos_db_net \
              -e ASPNETCORE_ENVIRONMENT=Development \
              -e Database__RunMigrationsOnStartup=true \
              -e ConnectionStrings__PostgreSqlConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e ConnectionStrings__Redis="${{ secrets.REDIS_CONNECTION_STRING }}" \
              -e ConnectionStrings__BlobStorageConnection="${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}" \
              -e Clerk__SecretKey="${{ secrets.CLERK_SECRET_KEY }}" \
              -e Clerk__WebhookSecret="${{ secrets.CLERK_WEBHOOK_SECRET }}" \
              -e GoogleAI__ApiKey="${{ secrets.GOOGLE_AI_API_KEY }}" \
              ${{ env.IMAGE_NAME }}

            # Attach container to npm_proxy_net for Nginx Proxy Manager routing
            docker network connect npm_proxy_net ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # Clean up unused/dangling Docker images to free up disk space
            docker image prune -f

            # Verify development container status
            sleep 3
            if docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
              echo "✅ Development container deployed successfully"
              docker ps -f name=${{ env.CONTAINER_NAME }}
            else
              echo "❌ Development container failed to start"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi