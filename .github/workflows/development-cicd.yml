name: Development CI/CD

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

env:
  IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/ntc.qos-be"
  DOTNET_VERSION: "8.0.x"
  CONTAINER_PORT: 8080
  CONTAINER_NAME: "ntc.qos-be"
  BUILD_CONFIGURATION: "Release"
  ASPNETCORE_ENVIRONMENT: "Development"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }}

  docker_build_and_push:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build --build-arg BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }} --build-arg ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }} -t ${{ env.IMAGE_NAME }}:dev -f ./NTC.QoS.API/Dockerfile .
          docker push ${{ env.IMAGE_NAME }}:dev

  deploy:
    name: Deploy to DigitalOcean
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker_build_and_push]
    environment: Development

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
              sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
              sudo apt-get update
              sudo apt-get install -y docker-ce
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Stop and remove existing container with better error handling
            echo "Stopping existing container..."
            if docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
              docker stop ${{ env.CONTAINER_NAME }}
              echo "Container stopped successfully"
            else
              echo "Container not running or doesn't exist"
            fi

            echo "Removing existing container..."
            if docker ps -a -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
              docker rm ${{ env.CONTAINER_NAME }}
              echo "Container removed successfully"
            else
              echo "Container doesn't exist"
            fi

            # Remove old image to free up space
            echo "Removing old image..."
            docker image rm ${{ env.IMAGE_NAME }}:dev || echo "Old image not found or in use"

            # Pull new image
            echo "Pulling new image..."
            docker pull ${{ env.IMAGE_NAME }}:dev

            # Run new container
            echo "Starting new container..."
            docker run \
              --restart unless-stopped \
              -d \
              --cpus="0.3" \
              --memory="384m" \
              -p 91:${{ env.CONTAINER_PORT }} \
              --name ${{ env.CONTAINER_NAME }} \
              -e ConnectionStrings__PostgreSqlConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e ConnectionStrings__HangfireConnection="${{ secrets.HANGFIRE_CONNECTION_STRING }}" \
              -e ConnectionStrings__BlobStorageConnection="${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}" \
              -e Clerk__SecretKey="${{ secrets.CLERK_SECRET_KEY }}" \
              ${{ env.IMAGE_NAME }}:dev

            # Verify container is running
            echo "Verifying deployment..."
            sleep 5
            if docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
              echo "✅ Container deployed successfully"
              docker ps -f name=${{ env.CONTAINER_NAME }}
            else
              echo "❌ Container failed to start"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi